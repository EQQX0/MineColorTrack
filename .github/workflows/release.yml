name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pillow onnx

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (python -c "import colorassist; print(colorassist.__version__)").Trim() }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v"

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/MineColorTrack.spec

      - name: Self-test the built app on Windows
        shell: pwsh
        run: |
          python tests/fake_model.py fake_model.onnx
          $model = Join-Path $pwd 'fake_model.onnx'
          $report = Join-Path $pwd 'selftest.json'
          $p = Start-Process -FilePath 'dist\MineColorTrack\MineColorTrack.exe' -ArgumentList '--selftest', "`"$report`"", '--selftest-model', "`"$model`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { throw 'Self-test wrote no report' }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\MineColorTrack.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test the installer (silent install, desktop shortcut, launch)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\MineColorTrack-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=desktopicon,addtopath' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MineColorTrack\MineColorTrack.exe'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MineColorTrack.lnk'
          if (!(Test-Path $exe)) { throw "Not installed: $exe" }
          if (!(Test-Path $lnk)) { throw "No desktop shortcut: $lnk" }
          $report = Join-Path $pwd 'installed-selftest.json'
          $model = Join-Path $pwd 'fake_model.onnx'
          $q = Start-Process -FilePath $exe -ArgumentList '--selftest', "`"$report`"", '--selftest-model', "`"$model`"" -Wait -PassThru
          Get-Content $report
          if ($q.ExitCode -ne 0) { throw "Installed app self-test failed" }
          "Installed OK: $exe"
          "Desktop shortcut: $lnk"
          "Installer size: {0:N1} MB" -f ($setup.Length / 1MB)

      - name: Test the mct command-line tool (PATH, offline edits, live control of the running app)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\MineColorTrack'
          $mct = Join-Path $dir 'mct.exe'
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw "mct folder not added to PATH" }
          & $mct --version
          $r = & $mct set capture.fps 90 | ConvertFrom-Json
          if ($r.value -ne 90 -or $r.applied_live) { throw "offline set failed: $r" }
          & $mct schema | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "schema failed" }
          Start-Process (Join-Path $dir 'MineColorTrack.exe')
          $running = $false
          for ($i = 0; $i -lt 60 -and -not $running; $i++) { Start-Sleep -Milliseconds 500; $running = (& $mct status | ConvertFrom-Json).running }
          if (-not $running) { throw "the app did not answer mct" }
          $r = & $mct set outline.thickness 9 | ConvertFrom-Json
          if (-not $r.applied_live) { throw "live set failed" }
          if ((& $mct get outline.thickness | ConvertFrom-Json).value -ne 9) { throw "live get failed" }
          & $mct target add Test --color "#50C84B" | Out-Null
          & $mct start | Out-Null
          Start-Sleep 3
          & $mct status
          & $mct windows
          & $mct quit | Out-Null
          Start-Sleep 3
          if ((& $mct status | ConvertFrom-Json).running) { throw "the app did not quit" }
          if ((Get-Content (Join-Path $env:APPDATA 'MineColorTrack\config.json') -Raw | ConvertFrom-Json).capture.fps -ne 90) { throw "settings not kept" }
          'mct OK'

      - name: Test the uninstaller (Start menu shortcuts, silent uninstall)
        shell: pwsh
        run: |
          $programs = [Environment]::GetFolderPath('Programs')
          $appLnk = Join-Path $programs 'MineColorTrack\MineColorTrack.lnk'
          $uninstLnk = Join-Path $programs 'MineColorTrack\Uninstall MineColorTrack.lnk'
          if (!(Test-Path $appLnk)) { throw "No Start menu shortcut: $appLnk" }
          if (!(Test-Path $uninstLnk)) { throw "No Start menu uninstall shortcut: $uninstLnk" }
          $settings = Join-Path $env:APPDATA 'MineColorTrack'
          New-Item -ItemType Directory -Force $settings | Out-Null
          Set-Content (Join-Path $settings 'config.json') '{}'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\MineColorTrack'
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'MineColorTrack.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'MineColorTrack.exe')) { throw 'Program files still present after uninstall' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'MineColorTrack.lnk')) { throw 'Desktop shortcut still present' }
          if (Test-Path $uninstLnk) { throw 'Start menu shortcuts still present' }
          if (!(Test-Path (Join-Path $settings 'config.json'))) { throw 'A silent uninstall should keep the settings' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw 'mct folder still in PATH after uninstall' }
          'Uninstall OK: program and shortcuts removed; settings kept (silent default answer is No)'

      - uses: actions/upload-artifact@v4
        with:
          name: MineColorTrack-installer
          path: |
            dist/MineColorTrack-Setup-*.exe
            selftest.json
            installed-selftest.json

      # Runs for a pushed v* tag, or when started by hand (Actions tab > Run workflow), in which case
      # the v<version> tag is created on this commit from colorassist/__init__.py's __version__.
      - name: Publish GitHub release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MineColorTrack ${{ steps.ver.outputs.version }}
          body_path: packaging/release_notes.md
          files: dist/MineColorTrack-Setup-*.exe
